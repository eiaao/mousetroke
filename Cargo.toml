[workspace]
resolver = "2"
members = ["crates/mousetroke-core", "crates/mousetroke-win", "crates/mousetroke", "crates/mousetroke-settings"]
# 设置程序（Tauri/WebView）构建较重且依赖前端产物，默认不参与 `cargo build/test`；
# 用 `cargo build -p mousetroke-settings` 或 scripts/build.cmd 构建。
default-members = ["crates/mousetroke-core", "crates/mousetroke-win", "crates/mousetroke"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/eiaao/mousetroke"
homepage = "https://eiaao.github.io/mousetroke/"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_Devices_Display",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
    "Win32_Graphics_Dwm",
    "Win32_System_Environment",
    "Win32_Storage_FileSystem",
    "Win32_Globalization",
] }

[profile.release]
lto = "thin"
strip = true
