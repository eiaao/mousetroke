name: Cloudflare Pages

# site/ 是纯静态站点：有改动时发布到 Cloudflare Pages（主站）。
# 需要仓库 Secrets：CLOUDFLARE_API_TOKEN（权限 Account → Cloudflare Pages → Edit）、CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/cloudflare.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

env:
  PROJECT: mousetroke
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID 为空：在仓库 Settings → Secrets and variables → Actions 里设置"
            exit 1
          fi
          # 不用 wrangler whoami：它要读账号成员信息，只有 Pages 权限的令牌会被拒绝。
          # 直接用要用到的权限验证：能列出 Pages 项目，令牌和账号 ID 就都是对的。
          npx --yes wrangler@4 pages project list > /dev/null
      - name: Check pages
        run: python3 site/check.py
      - name: Prepare
        # 生成器、校验脚本和替换表不属于网站内容
        run: rm -rf site/gen.py site/gen_changelog.py site/gen_alternatives.py site/alternatives_data.py site/alternatives_template.html site/check.py site/langs site/README.md site/__pycache__
      - name: Create project if missing
        run: |
          projects=$(npx --yes wrangler@4 pages project list) || exit 1
          if grep -qw "$PROJECT" <<< "$projects"; then
            echo "project $PROJECT exists"
          else
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main
          fi
      - name: Deploy
        run: npx --yes wrangler@4 pages deploy site --project-name "$PROJECT" --branch main --commit-dirty=true
