name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  macos-engine:
    runs-on: macos-latest
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mousetroke-settings/ui/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and test settings UI
        working-directory: crates/mousetroke-settings/ui
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Build macOS application
        run: cargo build -p mousetroke -p mousetroke-settings --locked
      - name: Test shared core, engine and macOS platform
        run: cargo test -p mousetroke-core -p mousetroke-engine -p mousetroke-mac --locked
      - name: Test settings commands and headless config round-trip smoke
        run: cargo test -p mousetroke-settings --locked

      - name: Universal bundle and DMG smoke test
        env:
          MOUSETROKE_SIGN_ID: "-"
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          bash scripts/mac/bundle.sh --universal
          bash scripts/mac/dmg.sh

  test:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mousetroke-settings/ui/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check changelog and website
        run: |
          python scripts/changelog.py check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p test_changelog.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python site/check.py --allow-mac-size-placeholder
      - name: Build settings UI
        working-directory: crates/mousetroke-settings/ui
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Test
        run: cargo test --workspace --locked
      - name: Audit npm dependencies
        working-directory: crates/mousetroke-settings/ui
        run: npm audit --omit=dev
