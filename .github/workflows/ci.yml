name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mousetroke-settings/ui/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build settings UI
        working-directory: crates/mousetroke-settings/ui
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Test
        run: cargo test --workspace --locked
      - name: Audit npm dependencies
        working-directory: crates/mousetroke-settings/ui
        run: npm audit --omit=dev
