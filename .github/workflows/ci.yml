name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  macos-engine:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test shared core and engine
        run: cargo test -p mousetroke-core -p mousetroke-engine --locked

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mousetroke-settings/ui/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check changelog and website
        run: |
          python scripts/changelog.py check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p test_changelog.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python site/check.py
      - name: Build settings UI
        working-directory: crates/mousetroke-settings/ui
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Test
        run: cargo test --workspace --locked
      - name: Audit npm dependencies
        working-directory: crates/mousetroke-settings/ui
        run: npm audit --omit=dev
