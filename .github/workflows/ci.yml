name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  macos-engine:
    runs-on: macos-latest
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mousetroke-settings/ui/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 前端类型检查与单测在 Windows 任务里跑；这里只构建供 Tauri 内嵌
      - name: Build settings UI
        working-directory: crates/mousetroke-settings/ui
        run: |
          npm ci
          npm run build
      - name: Test macOS crates and application
        run: cargo test -p mousetroke-core -p mousetroke-engine -p mousetroke-lua -p mousetroke-mac -p mousetroke-settings -p mousetroke --locked

      - name: Test macOS packaging gates
        run: python -m unittest discover -s scripts -p test_mac_packaging.py
      - name: Install DMG tooling
        env:
          # 运行器的 Homebrew Python 遵循 PEP 668；旧版 pip 忽略此变量
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: python3 -m pip install dmgbuild==1.6.5
      - name: Universal bundle and DMG smoke test
        env:
          MOUSETROKE_SIGN_ID: "-"
          MOUSETROKE_REQUIRE_SIGNING: "0"
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          /bin/bash scripts/mac/bundle.sh --universal
          /bin/bash scripts/mac/dmg.sh

  test:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      - name: Check forbidden product name
        shell: bash
        # 拆开拼写，工作流文件自身不含该词
        run: |
          pattern="wges""tures"
          if git grep -n -i "$pattern"; then
            echo "::error::仓库中出现了禁用的产品名"
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mousetroke-settings/ui/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check changelog
        run: |
          python scripts/changelog.py check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p test_changelog.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build settings UI
        working-directory: crates/mousetroke-settings/ui
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Test
        run: cargo test --workspace --locked
      - name: Audit npm dependencies
        working-directory: crates/mousetroke-settings/ui
        run: npm audit --omit=dev
