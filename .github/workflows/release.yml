name: Release

# 双平台测试构建全部成功后，只发布一份 Release 与一份 SHA256SUMS.txt。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mousetroke-settings/ui/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check tag matches Cargo version
        shell: pwsh
        run: |
          $v = python scripts/changelog.py version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match Cargo version $v" }
      - name: Prepare release notes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          python scripts/changelog.py notes ("${{ github.ref_name }}" -replace '^v', '') --out dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # 设置界面的 crate 编译时要内嵌 ui/dist，测试前必须先构建前端
      - name: Build settings UI
        working-directory: crates/mousetroke-settings/ui
        run: |
          npm ci
          npm run build
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        shell: cmd
        run: scripts\build.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/mousetroke.exe
            dist/release-notes.md
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      MOUSETROKE_REQUIRE_SIGNING: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Require stable signing secrets
        env:
          MAC_SIGN_P12_BASE64: ${{ secrets.MAC_SIGN_P12_BASE64 }}
          MAC_SIGN_P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
        run: |
          if [[ -z "$MAC_SIGN_P12_BASE64" || -z "$MAC_SIGN_P12_PASSWORD" ]]; then
            echo "::error::MAC_SIGN_P12_BASE64 and MAC_SIGN_P12_PASSWORD are required"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mousetroke-settings/ui/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and test settings UI
        working-directory: crates/mousetroke-settings/ui
        run: |
          npm ci || exit 1
          npm run typecheck || exit 1
          npm test || exit 1
          npm run build || exit 1
      - name: Install DMG layout tool
        env:
          # 运行器的 Homebrew Python 遵循 PEP 668；旧版 pip 忽略此变量
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: python3 -m pip install dmgbuild==1.6.5 || exit 1
      - name: Test macOS packaging gates
        run: python -m unittest discover -s scripts -p test_mac_packaging.py
      - name: Install universal targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Test core, engine, macOS and settings
        run: cargo test -p mousetroke-core -p mousetroke-engine -p mousetroke-mac -p mousetroke-settings --locked
      - name: Import stable release identity
        env:
          MAC_SIGN_P12_BASE64: ${{ secrets.MAC_SIGN_P12_BASE64 }}
          MAC_SIGN_P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/mousetroke-release.keychain-db"
          p12="$RUNNER_TEMP/mousetroke-release.p12"
          password=$(openssl rand -hex 32) || exit 1
          [[ -n "$password" ]] || { echo '::error::Empty keychain password'; exit 1; }
          printf '::add-mask::%s\n' "$password"
          security list-keychains -d user > "$RUNNER_TEMP/mousetroke-keychains.txt" || exit 1
          printf '%s' "$MAC_SIGN_P12_BASE64" | base64 -D > "$p12" || exit 1
          security create-keychain -p "$password" "$keychain" || exit 1
          security set-keychain-settings -lut 21600 "$keychain" || exit 1
          security unlock-keychain -p "$password" "$keychain" || exit 1
          security import "$p12" -k "$keychain" -P "$MAC_SIGN_P12_PASSWORD" -T /usr/bin/codesign >/dev/null 2>&1 || exit 1
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null 2>&1 || exit 1
          security list-keychains -d user -s "$keychain" || exit 1
          rm -f "$p12" || exit 1
          echo "MOUSETROKE_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV" || exit 1
          echo 'MOUSETROKE_SIGN_ID=Mousetroke Self-Signed' >> "$GITHUB_ENV" || exit 1
      - name: Universal signed bundle and DMG
        run: |
          /bin/bash scripts/mac/bundle.sh --universal || exit 1
          /bin/bash scripts/mac/dmg.sh || exit 1
          codesign -d -r- target/mac/Mousetroke.app || exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: target/mac/Mousetroke.dmg
          if-no-files-found: error
      - name: Delete temporary signing material
        if: always()
        run: |
          status=0
          keychains=()
          if [[ -f "$RUNNER_TEMP/mousetroke-keychains.txt" ]]; then
            while IFS= read -r line; do
              line=${line#*\"}; line=${line%\"*}
              if [[ -n "$line" ]]; then keychains+=("$line"); fi
            done < "$RUNNER_TEMP/mousetroke-keychains.txt" || status=1
            security list-keychains -d user -s ${keychains[@]+"${keychains[@]}"} || status=1
          fi
          if [[ -f "$RUNNER_TEMP/mousetroke-release.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/mousetroke-release.keychain-db" || status=1
          fi
          rm -f "$RUNNER_TEMP/mousetroke-release.p12" "$RUNNER_TEMP/mousetroke-keychains.txt" || status=1
          exit "$status"

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: dist
      - name: Combined checksums and publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$RELEASE_TAG" > latest.txt
          printf '%s\n' "$RELEASE_TAG" | cmp latest.txt -
          sha256sum mousetroke.exe Mousetroke.dmg latest.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" mousetroke.exe Mousetroke.dmg latest.txt SHA256SUMS.txt \
            --title "Mousetroke $RELEASE_TAG" --notes-file release-notes.md
