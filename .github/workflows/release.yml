name: Release

# 推送 v* 标签（如 v0.1.0）时：测试 → 构建 mousetroke.exe → 生成 SHA256SUMS.txt → 发布到 Releases
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write   # 只有这一步需要写权限：创建 Release 并上传文件
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mousetroke-settings/ui/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check tag matches Cargo version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match Cargo version $v" }
      - name: Prepare release notes
        shell: pwsh
        run: |
          python scripts/changelog.py notes ("${{ github.ref_name }}" -replace '^v', '') --out release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # 设置界面的 crate 编译时要内嵌 ui/dist，测试前必须先构建前端
      - name: Build settings UI
        working-directory: crates/mousetroke-settings/ui
        run: |
          npm ci
          npm run build
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        shell: cmd
        run: scripts\build.cmd
      - name: Checksums
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\mousetroke.exe -Algorithm SHA256).Hash.ToLower()
          "$h  mousetroke.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist\mousetroke.exe dist\SHA256SUMS.txt --title "Mousetroke ${{ github.ref_name }}" --notes-file release-notes.md
