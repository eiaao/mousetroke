name: Feature request / 功能建议
description: Suggest an idea / 提一个想法
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do? / 你想做到什么
      description: Describe the situation, not only the solution. / 说说使用场景，而不只是方案。
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution / 建议的做法
