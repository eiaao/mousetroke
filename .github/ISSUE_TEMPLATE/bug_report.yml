name: Bug report / 问题反馈
description: Something doesn't work as expected / 程序行为不对
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened / 发生了什么
      description: What you did, what you expected, what happened instead. / 做了什么、期望什么、实际怎样。
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Mousetroke version / 版本
      description: Settings → About / 设置 → 关于
      placeholder: "0.1.0"
    validations: { required: true }
  - type: input
    id: os
    attributes:
      label: OS version / 系统版本
      placeholder: Windows 11 24H2 / macOS 15.1
    validations: { required: true }
  - type: input
    id: app
    attributes:
      label: Which program were you using? / 在哪个程序里出的问题
      placeholder: chrome.exe
  - type: textarea
    id: log
    attributes:
      label: Log excerpt / 日志片段
      description: >-
        Settings → About → Feedback → Report on GitHub copies a diagnostics report (version, system,
        displays, settings summary, recent log) to the clipboard — paste it here. On older versions:
        About → Open log, and paste the lines around the problem. The log never contains typed keys,
        but it does contain program names — remove anything you don't want to share.
        设置 → 关于 → 反馈 →「在 GitHub 提交」会把诊断信息（版本、系统、显示器、设置摘要、最近的日志）复制到剪贴板，
        粘贴到这里即可。旧版本请在关于页打开日志，贴出出问题前后的几行。日志不含按键内容，但有程序名，不想公开的请删掉。
      render: text
    validations: { required: true }
