[package]
name = "mousetroke"
description = "Mousetroke — Windows 全局鼠标手势"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "mousetroke"
path = "src/main.rs"

[dependencies]
mousetroke-core = { path = "../mousetroke-core" }
mousetroke-win = { path = "../mousetroke-win" }
# 设置界面编进同一个 exe（`mousetroke settings` 启动独立的界面进程）
mousetroke-settings = { path = "../mousetroke-settings" }
serde_json = { workspace = true }

[build-dependencies]
winresource = "0.1.34"
