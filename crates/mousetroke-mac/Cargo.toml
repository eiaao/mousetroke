[package]
name = "mousetroke-mac"
description = "Mousetroke macOS 平台层"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mousetroke-core = { path = "../mousetroke-core" }
mousetroke-engine = { path = "../mousetroke-engine" }
mousetroke-lua = { path = "../mousetroke-lua" }
regex = "1"
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString", "NSURL", "NSLocale", "NSDate", "NSDateFormatter", "NSFileManager", "NSError", "NSRunLoop", "NSTimer", "NSNotification", "NSDistributedNotificationCenter", "NSOperation", "NSValue", "NSData", "NSDictionary", "block2"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "libc", "NSApplication", "NSAlert", "NSCell", "NSGraphicsContext", "NSResponder", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSWindow", "NSGraphics", "NSFont", "NSAttributedString", "NSStringDrawing", "NSMenu", "NSMenuItem", "NSImage", "NSBezierPath", "NSColor", "NSEvent", "NSScreen", "NSWorkspace", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "block2", "objc2-core-foundation", "objc2-core-graphics", "objc2-quartz-core"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFMachPort", "CFRunLoop", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventTypes", "CGEventSource", "CGRemoteOperation", "CGDirectDisplay", "CGGeometry", "CGPath", "CGColor"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["std", "CALayer", "CAShapeLayer", "CATextLayer", "CATransaction", "CAAnimation", "CAMediaTiming", "objc2-core-foundation", "objc2-core-graphics"] }
block2 = "=0.6.2"

[dev-dependencies]
mousetroke-core = { path = "../mousetroke-core" }
mousetroke-engine = { path = "../mousetroke-engine" }
